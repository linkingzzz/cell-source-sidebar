<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <title>数据源</title>
    <style>
      body { font-family: "Microsoft YaHei", Arial, sans-serif; margin: 10px; font-size: 13px; color: #222; }
      h4 { margin: 14px 0 6px; font-size: 13px; font-weight: 600; border-left: 3px solid #2b6cb0; padding-left: 6px; }
      .muted { color: #666; }
      input[type=text], textarea { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12px; }
      textarea { height: 90px; }
      #attList { margin-top: 6px; }
      .att { display: flex; align-items: center; justify-content: space-between; padding: 2px 0; }
      .att a { color: #2b6cb0; cursor: pointer; text-decoration: none; word-break: break-all; }
      .att a:hover { text-decoration: underline; }
      .att .del { color: #c53030; cursor: pointer; margin-left: 8px; white-space: nowrap; }
      table.grid { border-collapse: collapse; width: 100%; table-layout: fixed; }
      table.grid td { border: 1px solid #cbd5e0; padding: 0; height: 22px; }
      table.grid input { border: 0; padding: 3px; font-size: 12px; height: 21px; }
      table.grid input:focus { outline: 1px solid #2b6cb0; }
      button { font-family: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; }
      #status { margin-top: 10px; color: #666; }
      #log { margin-top: 8px; color: #888; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <div><b>数据源</b>　<span class="muted">工作簿：<span id="wbName"></span></span></div>
    <div class="muted">选中单元格：<span id="sel"></span> <span id="state"></span>　已存批注 <span id="metaCount">0</span></div>

    <h4>1、附件</h4>
    <div><button id="uploadBtn">上传附件</button><input type="file" id="fileInput" style="display:none" /></div>
    <div id="attList"></div>

    <h4>2、明细表（9 × 4）</h4>
    <table class="grid"><tbody id="gridBody"></tbody></table>

    <h4>3、备注</h4>
    <textarea id="note" placeholder="针对该单元格的说明"></textarea>

    <div style="margin-top:10px"><button id="saveBtn">保存到工作簿</button></div>
    <div id="status">Initializing...</div>
    <div id="log"></div>

    <script src="metadata.js"></script>
    <script src="taskpane.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <title>Cell Source Sidebar - Taskpane</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: Arial, sans-serif; margin: 12px; }
      #header { font-weight: bold; margin-bottom: 8px; }
      label { display:block; margin-top:8px; }
      textarea { width:100%; height:120px; }
      table { width:100%; border-collapse: collapse; }
      td, th { border: 1px solid #ddd; padding: 6px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="header">Cell Source Sidebar (MVP)</div>
      <div id="status">Initializing...</div>
      <div id="selection">Selection: <span id="selectionAddr"></span></div>

      <div id="entryArea">
        <label>Source:<input id="inputSource" style="width:100%" /></label>
        <label>URL:<input id="inputUrl" style="width:100%" /></label>
        <label>Note:<textarea id="inputNote"></textarea></label>
        <label>Attachments:<input id="fileInput" type="file" /></label>
        <div id="attachmentsList"></div>
        <button id="saveBtn">Save to workbook</button>
      </div>

    </div>
    <script src="metadata.js"></script>
    <script src="taskpane.js"></script>
  </body>
</html>
